org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official
# Robolectric, a test-only dependency, brings androidx.test onto the unit test
# classpath. The library's own runtime classpath has the Kotlin standard library
# and nothing else; `runtimeDependencyCheck` in togo/build.gradle.kts, part of
# `./gradlew check`, fails otherwise.
android.useAndroidX=true
